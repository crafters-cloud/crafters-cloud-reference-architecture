version: 2
# Every feed in nuget.config must be declared here; Dependabot's proxy blocks undeclared hosts
registries:
  crafters-feed:
    type: nuget-feed
    url: https://www.myget.org/F/crafters-cloud/api/v3/index.json
  nuget-org:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json
updates:
  - package-ecosystem: nuget
    directory: /
    registries:
      - crafters-feed
      - nuget-org
    schedule:
      interval: weekly
    groups:
      crafters-core:
        patterns: ["CraftersCloud.Core*"]
      aspire:
        patterns: ["Aspire.*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Verify 33+ fails the build without a sponsorship declaration (SponsorCheck)
      - dependency-name: Verify*
        versions: [">=33.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
